name: Release of a new version

# When this workflow should run
on:
  push:
    branches: [ master ]

  # Manual trigger — always available
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: 'latest'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Permissions needed to push to GitHub Container Registry
    permissions:
      contents: read
      packages: write
    env:
      # Image name derived from the repository path
      IMAGE: ghcr.io/vladimirantos/myinvoice
      # Endpoint to notify Rosti to pull and restart after a push (stack 1 — vladimirantos)
      PULL_ENDPOINT: ${{ secrets.PULL_ENDPOINT }}
      # Stack 2 (spotted, id 542) — deploy přes SSH (rosticli/webhook tam nedosáhne).
      # Privátní deploy klíč; prázdný secret = spotted deploy se přeskočí.
      SPOTTED_SSH_KEY: ${{ secrets.SPOTTED_SSH_KEY }}
      SPOTTED_SSH_HOST: ssh.rosti.cz
      SPOTTED_SSH_PORT: "29019"
    steps:
      - uses: actions/checkout@v4

      # Verify PULL_ENDPOINT secret is set (only checked when using a secret)
      - name: Test that PULL_ENDPOINT is set
        run: test -n "$PULL_ENDPOINT" || { echo "Secret PULL_ENDPOINT is not set!"; exit 1; }

      # Set image tag to short commit SHA on push
      - name: Get image tag on push
        if: github.event_name == 'push'
        run: echo "TAG_NAME=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      # Set image tag to git tag on release
      - name: Get image tag on release
        if: github.event_name == 'release'
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      # Set image tag to the chosen string on manual trigger
      - name: Get image tag on workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "TAG_NAME=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      # Debug output
      - name: Debug info
        run: |
          echo "Username: ${{ github.actor }}"
          echo "Image: $IMAGE"
          echo "Image tag: ${{ env.TAG_NAME }}"

      # Log in to GitHub Container Registry
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Build image
      - name: Build
        run: docker build -t $IMAGE:${{ env.TAG_NAME }} .

      # Tag as latest
      - name: Tag latest
        run: docker tag $IMAGE:${{ env.TAG_NAME }} $IMAGE:latest

      # Push versioned tag
      - name: Push
        run: docker push $IMAGE:${{ env.TAG_NAME }}

      # Push latest tag
      - name: Push latest
        run: docker push $IMAGE:latest

      # Tell Rosti to pull the new image and restart the stack.
      #
      # Robustní varianta: endpoint dělá `docker compose pull && up` synchronně.
      # U velkého image (9 vrstev, ~2 min) občas přeteče proxy timeout → vrátí
      # ne-JSON (HTML/504) a původní `jq -r '.status'` pod `bash -e` shodil celý
      # krok (exit 5: "Invalid numeric literal"). Proto:
      #   - set +e + jq 2>/dev/null → ne-JSON neshazuje krok
      #   - retry s prodlevou → 1. call stáhne image na Rosti (doběhne i po HTTP
      #     timeoutu), další call už ho má v cache → rychlý → vrátí {status:0}
      #   - selžeme až po vyčerpání pokusů, s ručním fallbackem
      # Stack 1 (vladimirantos, 508) — pull+up přes Rosti webhook (rosticli setup-cicd).
      # Robustní: set +e + jq 2>/dev/null (ne-JSON neshazuje), retry s prodlevou.
      - name: Deploy stack 1 (vladimirantos) — pull endpoint
        shell: bash
        run: |
          set +e
          attempts=5; delay=75; ok=0
          for i in $(seq 1 $attempts); do
            echo "Deploy trigger — pokus $i/$attempts…"
            RESPONSE=$(curl -sS --connect-timeout 15 --max-time 300 "$PULL_ENDPOINT")
            CURL_RC=$?
            STATUS=$(printf '%s' "$RESPONSE" | jq -r '.status' 2>/dev/null)
            if [ "$CURL_RC" = "0" ] && [ "$STATUS" = "0" ]; then
              echo "✓ Pull endpoint OK (pokus $i)"; printf '%s' "$RESPONSE" | jq -r '.stdout // empty' 2>/dev/null; ok=1; break
            fi
            echo "::warning::pokus $i neúspěšný (curl_rc=$CURL_RC, status='${STATUS:-<ne-JSON>}')."
            printf '%s' "$RESPONSE" | head -c 800; echo
            [ "$i" -lt "$attempts" ] && { echo "Čekám ${delay}s…"; sleep "$delay"; }
          done
          [ "$ok" = "1" ] || { echo "::error::Stack vladimirantos nedoběhl. Image je na ghcr."; exit 1; }

      # Stack 2 (spotted, 542) — deploy přes SSH (panel-managed stack, bez webhooku).
      # SSH na VM, `docker compose pull && up` v /srv/stack (image je veřejný na ghcr,
      # migrace běží přes docker-entrypoint.sh při startu kontejneru). Bez secretu se přeskočí.
      - name: Deploy stack 2 (spotted) — SSH
        if: ${{ env.SPOTTED_SSH_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Klíč je v secretu base64 (jednořádkový → odolný vůči CRLF/zalomení při vložení).
          printf '%s' "$SPOTTED_SSH_KEY" | base64 -d > ~/.ssh/spotted_deploy
          chmod 600 ~/.ssh/spotted_deploy
          # accept-new = host key se přijme při 1. spojení (nezávisí na ssh-keyscan,
          # který v runneru selhával → host key verification → exit 255).
          ssh -i ~/.ssh/spotted_deploy -p "$SPOTTED_SSH_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "root@$SPOTTED_SSH_HOST" \
            "bash -c 'cd /srv/stack && docker compose pull && docker compose up -d'"
          echo "✓ Spotted deploy přes SSH OK"
