name: Release of a new version

# When this workflow should run
on:
  push:
    branches: [ master ]

  # Manual trigger — always available
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: 'latest'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Permissions needed to push to GitHub Container Registry
    permissions:
      contents: read
      packages: write
    env:
      # Image name derived from the repository path
      IMAGE: ghcr.io/vladimirantos/myinvoice
      # Endpoint to notify Rosti to pull and restart after a push (stack 1 — vladimirantos)
      PULL_ENDPOINT: ${{ secrets.PULL_ENDPOINT }}
      # Druhý stack (spotted) — volitelný. Prázdný secret = krok ho přeskočí.
      PULL_ENDPOINT_SPOTTED: ${{ secrets.PULL_ENDPOINT_SPOTTED }}
    steps:
      - uses: actions/checkout@v4

      # Verify PULL_ENDPOINT secret is set (only checked when using a secret)
      - name: Test that PULL_ENDPOINT is set
        run: test -n "$PULL_ENDPOINT" || { echo "Secret PULL_ENDPOINT is not set!"; exit 1; }

      # Set image tag to short commit SHA on push
      - name: Get image tag on push
        if: github.event_name == 'push'
        run: echo "TAG_NAME=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      # Set image tag to git tag on release
      - name: Get image tag on release
        if: github.event_name == 'release'
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      # Set image tag to the chosen string on manual trigger
      - name: Get image tag on workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "TAG_NAME=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      # Debug output
      - name: Debug info
        run: |
          echo "Username: ${{ github.actor }}"
          echo "Image: $IMAGE"
          echo "Image tag: ${{ env.TAG_NAME }}"

      # Log in to GitHub Container Registry
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Build image
      - name: Build
        run: docker build -t $IMAGE:${{ env.TAG_NAME }} .

      # Tag as latest
      - name: Tag latest
        run: docker tag $IMAGE:${{ env.TAG_NAME }} $IMAGE:latest

      # Push versioned tag
      - name: Push
        run: docker push $IMAGE:${{ env.TAG_NAME }}

      # Push latest tag
      - name: Push latest
        run: docker push $IMAGE:latest

      # Tell Rosti to pull the new image and restart the stack.
      #
      # Robustní varianta: endpoint dělá `docker compose pull && up` synchronně.
      # U velkého image (9 vrstev, ~2 min) občas přeteče proxy timeout → vrátí
      # ne-JSON (HTML/504) a původní `jq -r '.status'` pod `bash -e` shodil celý
      # krok (exit 5: "Invalid numeric literal"). Proto:
      #   - set +e + jq 2>/dev/null → ne-JSON neshazuje krok
      #   - retry s prodlevou → 1. call stáhne image na Rosti (doběhne i po HTTP
      #     timeoutu), další call už ho má v cache → rychlý → vrátí {status:0}
      #   - selžeme až po vyčerpání pokusů, s ručním fallbackem
      - name: Call pull+up endpoint (oba stacky)
        shell: bash
        run: |
          set +e
          # Robustní notifikace jednoho stacku: retry + tolerance ne-JSON (proxy timeout).
          notify() {
            local name="$1" ep="$2"
            local attempts=5 delay=75 ok=0
            for i in $(seq 1 $attempts); do
              echo "[$name] Deploy trigger — pokus $i/$attempts…"
              RESPONSE=$(curl -sS --connect-timeout 15 --max-time 300 "$ep")
              CURL_RC=$?
              STATUS=$(printf '%s' "$RESPONSE" | jq -r '.status' 2>/dev/null)
              if [ "$CURL_RC" = "0" ] && [ "$STATUS" = "0" ]; then
                echo "[$name] ✓ Pull endpoint OK (pokus $i)"
                printf '%s' "$RESPONSE" | jq -r '.stdout // empty' 2>/dev/null
                ok=1; break
              fi
              echo "::warning::[$name] pokus $i neúspěšný (curl_rc=$CURL_RC, status='${STATUS:-<ne-JSON>}'). Odpověď (zkráceno):"
              printf '%s' "$RESPONSE" | head -c 800; echo
              [ "$i" -lt "$attempts" ] && { echo "[$name] Čekám ${delay}s a zkusím znovu…"; sleep "$delay"; }
            done
            return $([ "$ok" = "1" ] && echo 0 || echo 1)
          }

          overall=0
          # Stack 1 (vladimirantos) — povinný.
          notify "vladimirantos" "$PULL_ENDPOINT" || { echo "::error::Stack vladimirantos nedoběhl."; overall=1; }
          # Stack 2 (spotted) — volitelný: bez secretu se přeskočí.
          if [ -n "$PULL_ENDPOINT_SPOTTED" ]; then
            notify "spotted" "$PULL_ENDPOINT_SPOTTED" || { echo "::error::Stack spotted nedoběhl."; overall=1; }
          else
            echo "PULL_ENDPOINT_SPOTTED není nastaven → spotted stack přeskočen."
          fi

          if [ "$overall" != "0" ]; then
            echo "::error::Aspoň jeden stack nepotvrdil úspěch. Image je na ghcr — nasaď ručně: rosticli stacks ssh docker compose up -d app"
            exit 1
          fi
